<a class="research-visual{% if include.paper.visual.style %} research-visual--{{ include.paper.visual.style | escape }}{% endif %}" href="{% if include.paper.visual.page %}{{ include.paper.visual.page | relative_url }}{% elsif include.paper.url %}{{ include.paper.url }}{% else %}{{ include.paper.visual.video | relative_url }}{% endif %}"{% if include.paper.visual.page %} data-video-dialog{% endif %}{% if include.paper.visual.caption %} data-video-caption="{{ include.paper.visual.caption | escape }}"{% endif %} aria-label="{{ include.paper.title | escape }}">
  <video muted playsinline loop preload="{{ include.paper.visual.preload | default: 'none' }}"{% if include.paper.visual.restart_on_hover %} data-restart-on-hover{% endif %} poster="{{ include.paper.visual.poster | relative_url }}" aria-hidden="true" tabindex="-1" width="{{ include.paper.visual.width | default: 480 }}" height="{{ include.paper.visual.height | default: 360 }}">
    <source src="{{ include.paper.visual.video | relative_url }}" type="video/mp4">
  </video>
  {% if include.paper.visual.static_poster %}<img class="research-visual-poster" src="{{ include.paper.visual.poster | relative_url }}" alt="" aria-hidden="true" width="{{ include.paper.visual.width }}" height="{{ include.paper.visual.height }}">{% endif %}
  <span class="research-visual-title" aria-hidden="true">{{ include.paper.title | escape }}</span>
</a>
