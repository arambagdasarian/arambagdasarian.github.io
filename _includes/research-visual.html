<a class="research-visual" href="{{ include.paper.url }}" aria-label="{{ include.paper.title | escape }}">
  <video muted playsinline loop preload="none" poster="{{ include.paper.visual.poster | relative_url }}" aria-hidden="true" tabindex="-1" width="480" height="360">
    <source src="{{ include.paper.visual.video | relative_url }}" type="video/mp4">
  </video>
  <span class="research-visual-title" aria-hidden="true">{{ include.paper.title | escape }}</span>
</a>
