---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="back-link"><a href="{{ '/updates/' | relative_url }}">All updates</a></p>
    <h1>{{ page.title | escape }}</h1>
    <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>{% if page.updated %}<span> · Updated <time datetime="{{ page.updated | date_to_xmlschema }}">{{ page.updated | date: '%B %-d, %Y' }}</time></span>{% endif %}</p>
  </header>
  <div class="post-body">{{ content }}</div>
</article>
